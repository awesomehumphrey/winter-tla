<!DOCTYPE html>
<html lang='en'>
   <meta charset="utf-8">
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="styles/dashboard.css" type="text/css" rel="stylesheet"/>

     <!-- Javascript-->
     <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
     <script src="//d3js.org/d3.v4.min.js"></script>
     <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css" integrity="sha256-h20CPZ0QyXlBuAw7A+KluUYx/3pK+c7lYEpqLTlxjYQ=" crossorigin="anonymous" />
   <title>Visualisation of TLA+ Specifications</title>
   <link rel="stylesheet" href="styles.css">
   <style>
      .background {
        fill: #EEE;
      }
      line {
        stroke: #fff;
      }
      text.active {
        fill: red;
      }
      div.tooltip { 
        position: absolute;     
        text-align: center;     
        width: 150px;          
        padding: 2px;       
        font: 12px sans-serif;    
        background: lightgrey; 
        border: 0px;    
        border-radius: 8px;     
        pointer-events: none;     
      }
      #uploadLabel {
        margin-right: 0.5em;
      }
      #clear {
          display: none;
      }

      #home-button, #explore-button, #split-button {
          color: inherit;
          text-decoration: inherit;
      }
   </style>
   <script>
      if (new URLSearchParams(window.location.search).has('embedded')) {
         document.write('<style>html, body { margin: 0; } #navbar, #toolbar { display: none !important; } body { display: block; } #dashboard-main svg { width: 100%; height: auto; margin-left: 0 !important; }</style>');
      }
   </script>
   <script src="https://d3js.org/d3.v5.min.js"></script>
   <body>
    <div id="navbar">
      <ul>
         <li><a href="./graphview.html" id="home-button"><i class="fas fa-sun"></i> Graph view</a></li>
         <li><a href="./matrixview.html" id="explore-button"><i class="fas fa-columns"></i> Matrix view</a></li>
         <li><a href="./splitview.html" id="split-button"><i class="fas fa-th-large"></i> Split view</a></li>
      </ul>
      <hr>
   </div>
     <div id="dashboard-main">
      <div id="toolbar">
        <h2 class="title">MATRIX VIEW</h2> 
        <p>
           <label id="uploadLabel">Upload Graph JSON file</label><input type="file" id="input" class="form-control-file" accept=".json">
           <button type="button" class="btn btn-danger" id="clear">Clear graph</button>
        </p>
        <p>
        Order: 
          <select id="order">
              <option value="group">by Cluster</option>
              <option value="name">by node ID</option>
          </select>
        </p>
     </div>
      <script>
         const inputElement = document.getElementById("input");
         const clearButton = document.getElementById("clear");
         
         inputElement.addEventListener("change", handleFiles, false);
         clearButton.addEventListener("click", clearDashboard, false);

        function handleFiles() {
            const fileList = this.files;
            const reader = new FileReader();
            reader.addEventListener('error', (error) => {
                console.log(error);
            })
            reader.addEventListener('load', (event) => {
                const result = event.target.result;
                try {
                    graph = JSON.parse(result);
                }
                catch(e) {
                    console.log(e);
                }
                finally {
                    render(graph);
                }  
            });
            reader.readAsText(fileList[0]);
            clearButton.style.display = "block";
        }

        function clearDashboard()
         {
             svg.selectAll("*").remove();
             document.getElementById("input").value = "";
             clearButton.style.display = "none";
         }

         var margin = {top: 40, right: 0, bottom: 10, left: 80},
             width = 720,
             height = 720;
         
         var x = d3.scaleBand().range([0, width]),
             z = d3.scaleLinear().domain([0, 4]).clamp(true),
             c = d3.scaleOrdinal(d3.schemeCategory10);
         
         var totalWidth = width + margin.left + margin.right;
         var totalHeight = height + margin.top + margin.bottom;
         var svg = d3.select("#dashboard-main").append("svg")
             .attr("width", totalWidth)
             .attr("height", totalHeight)
             .attr("viewBox", "0 0 " + totalWidth + " " + totalHeight)
             .style("margin-left", -margin.left + "px")
             .append("g")
             .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
         
         let div = d3.select("body").append("div") 
                 .attr("class", "tooltip")       
                 .style("opacity", 0);
        
        function render(graph)
        {
          svg.selectAll("*").remove();
          var matrix = [],
               nodes = graph.nodes,
               n = nodes.length;
           // Compute index per node.
           nodes.forEach(function(node, i) {
             node.index = i;
             node.count = 0;
             matrix[i] = d3.range(n).map(function(j) { return {x: j, y: i, z: 0}; });
           });
         
           // Build lookup from node id to array index.
           var idToIndex = {};
           nodes.forEach(function(node, i) {
             idToIndex[node.id] = i;
           });
           currentIdToIndex = idToIndex;
           currentNodes = nodes;

           // Convert links to matrix; count character occurrences.
           graph.links.forEach(function(link) {
             var si = idToIndex[link.source];
             var ti = idToIndex[link.target];
             if (si !== undefined && ti !== undefined) {
               matrix[si][ti].z += 1;
               nodes[si].count += 1;
               nodes[ti].count += 1;
             }
           });
         
             // Precompute the orders.
             var orders = {
               name: d3.range(n).sort(function(a, b) { return d3.ascending(nodes[a].id, nodes[b].id); }),
               group: d3.range(n).sort(function(a, b) { 
               if (nodes[b].group === nodes[a].group) {
                 return nodes[a].id - nodes[b].id;
               }
               // return d3.ascending(nodes[a].group, nodes[b].group)
               return nodes[b].group - nodes[a].group; 
             })
           };
         
           // The default sort order.
           x.domain(orders.group);
         
           const groups = new Array(...(new Set(graph.nodes.map(({group}) => group)))); 
           const groupMap = graph.nodes.reduce((prev, node) => ({...prev, [node.id]: node.group}), {});

         
           var nodeIds = new Array(...(new Set(graph.nodes.map(({id}) => id)))); 
           var nodeMatrix = nodeIds.map(_ => nodeIds);
           
           svg.append("rect")
               .attr("class", "background")
               .attr("width", width)
               .attr("height", height);
         
         
           var row = svg.selectAll(".row")
               .data(matrix)
               .enter()
               .append("g")
               .attr("class", "row")
               .attr("transform", function(d, i) { return "translate(0," + x(i) + ")"; })
               .each(eachrow);
         
         
           row.append("line")
               .attr("x2", width);
         
           const textMouseOver = (d, i) => {
             div.transition()
             .duration(200)
             .style("opacity", .9);

             var nodeId = nodes[i].id;
             var nodeLabel = nodes[i].label || String(nodeId);
             div.html(`
               <h6>${nodeLabel}</h6>
               <p>Group: <strong>${nodes[i].group}</strong></p>
             `)
             .style("left", (d3.event.pageX) + "px")
             .style("top", (d3.event.pageY - 28) + "px");

             // Highlight this row/column
             highlightRowCol(i);

             // Send highlight to parent for coordinated views
             if (window.parent !== window) {
                window.parent.postMessage({ type: "highlight", nodeId: nodeId }, "*");
             }
           };
         
           row.append("text")
               .attr("x", -6)
               .attr("y", x.bandwidth() / 2)
               .attr("dy", ".32em")
               .attr("text-anchor", "end")
               .text(function(d, i) { return nodes[i].label || nodes[i].id })
               .attr("fill", (d, i) => c(nodes[i].group))
               .on("mouseover", textMouseOver)
               .on("mouseout", mouseout);
         
           
           var column = svg.selectAll(".column")
               .data(matrix)
               .enter().append("g")
               .attr("class", "column")
               .attr("transform", (d, i) => { return "translate(" + x(i) + ")rotate(-90)"; });
         
           column.append("line")
               .attr("x1", -width);
         
           column.append("text")
               .attr("x", 6)
               .attr("y", x.bandwidth() / 2)
               .attr("dy", ".32em")
               .attr("fill", (_, i) => c(nodes[i].group))
               .attr("text-anchor", "start")
               .text((d, i) => nodes[i].label || nodes[i].id)
               .on("mouseover", textMouseOver)
               .on("mouseout", mouseout);
         
           function eachrow(row) {
             d3.select(this).selectAll(".cell").remove();
         
             var cell = d3.select(this).selectAll(".cell")
                 .data(row)
                 .enter()
                 .append("rect")
                 .attr("class", "cell")
                 .attr("x", function(d) { return x(d.x); })
                 .attr("width", (d) => x.bandwidth() * 0.95)
                 .attr("height", (d) => x.bandwidth() * 0.95)
                 .style("fill-opacity", function(d) { 
                   if (d.z) return 1;
                   const orderselection = document.getElementById("order").value;
                   if (orderselection === "group" && nodes[d.x].group === nodes[d.y].group) return 0.4;
                   return 0;
                 })
                 .style("fill", function(d) { 
                   if (d.z) return "black";
                   if (nodes[d.x].group === nodes[d.y].group) return c(nodes[d.y].group);
                   return null;
                 })
                 .on("mouseover", (d, i) => {if (d.z) 
                   mouseover(d, i)
                 })
                 .on("mouseout", mouseout);
        }
         
           function mouseover(d, i) {
             d3.selectAll(".row text").classed("active", function(d, i) { return i == d.y; });
             d3.selectAll(".column text").classed("active", function(d, i) { return i == d.x; });

             var srcLabel = nodes[d.y].label || String(nodes[d.y].id);
             var tgtLabel = nodes[d.x].label || String(nodes[d.x].id);
             // Find the link value for this edge
             var linkVal = "";
             graph.links.forEach(function(link) {
                var si = idToIndex[link.source];
                var ti = idToIndex[link.target];
                if (si === d.y && ti === d.x && link.value) linkVal = link.value;
             });

             // Send highlight for the source node to coordinated views
             if (window.parent !== window) {
                window.parent.postMessage({ type: "highlight", nodeId: nodes[d.y].id }, "*");
             }

             div.transition()
                 .duration(200)
                 .style("opacity", .9);
             div.html(`
                 <p> Source: <strong>${srcLabel}</strong> </p>
                 <p> Target: <strong>${tgtLabel}</strong> </p>
                 ${linkVal ? '<p> Action: <strong>' + linkVal + '</strong> </p>' : ''}
             `)
             .style("left", (d3.event.pageX) + "px")
             .style("top", (d3.event.pageY - 28) + "px");
           }
         
           function highlightRowCol(idx) {
             d3.selectAll(".row text").classed("active", function(d, i) { return i === idx; });
             d3.selectAll(".column text").classed("active", function(d, i) { return i === idx; });
             // Highlight only connected cells in this row and column
             d3.selectAll(".cell").style("stroke", function(d) {
                return (d.y === idx || d.x === idx) && d.z > 0 ? "#E74C3C" : "none";
             }).style("stroke-width", function(d) {
                return (d.y === idx || d.x === idx) && d.z > 0 ? "2px" : "0";
             });
           }

           function unhighlightAllMatrix() {
             d3.selectAll("text").classed("active", false);
             d3.selectAll(".cell").style("stroke", "none").style("stroke-width", "0");
           }

           function mouseout() {
             unhighlightAllMatrix();
             div.transition()
                 .duration(500)
                 .style("opacity", 0);
             if (window.parent !== window) {
                window.parent.postMessage({ type: "unhighlight" }, "*");
             }
           }
         
           d3.select("#order").on("change", function() {
             clearTimeout(timeout);
             order(this.value);
           });
         
           function order(value) {
             x.domain(orders[value]);
             var t = svg.transition().duration(0);
         
             t.selectAll(".row")
                 .delay(function(d, i) { return x(i); })
                 .attr("transform", function(d, i) { return "translate(0," + x(i) + ")"; })
               .selectAll(".cell")
                 .delay(function(d) { return x(d.x); })
                 .attr("x", function(d) { return x(d.x); });
         
             t.selectAll(".column")
                 .delay(function(d, i) { return x(i); })
                 .attr("transform", function(d, i) { return "translate(" + x(i) + ")rotate(-90)"; });
             
             row.each(eachrow);
             }
         
           var timeout = setTimeout(function() {
             order("group");
             d3.select("#order").property("selectedIndex", 0).node().focus();
           }, 500);
         };

         // Track idToIndex at outer scope for message-based highlighting
         var currentIdToIndex = {};
         var currentNodes = [];

         // Listen for messages from split view
         window.addEventListener("message", function(event) {
            if (event.data && event.data.type === "loadJSON") {
               try {
                  graph = JSON.parse(event.data.data);
                  render(graph);
                  clearButton.style.display = "block";
               } catch(e) {
                  console.log(e);
               }
            } else if (event.data && event.data.type === "clearDashboard") {
               clearDashboard();
            } else if (event.data && event.data.type === "highlight") {
               var idx = currentIdToIndex[event.data.nodeId];
               if (idx !== undefined) {
                  d3.selectAll(".row text").classed("active", function(d, i) { return i === idx; });
                  d3.selectAll(".column text").classed("active", function(d, i) { return i === idx; });
                  d3.selectAll(".cell").style("stroke", function(d) {
                     return (d.y === idx || d.x === idx) && d.z > 0 ? "#E74C3C" : "none";
                  }).style("stroke-width", function(d) {
                     return (d.y === idx || d.x === idx) && d.z > 0 ? "2px" : "0";
                  });
               }
            } else if (event.data && event.data.type === "unhighlight") {
               d3.selectAll("text").classed("active", false);
               d3.selectAll(".cell").style("stroke", "none").style("stroke-width", "0");
            }
         });

      </script>
      </div>
   </body>
</html>
