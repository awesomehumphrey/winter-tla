<!DOCTYPE html>
<html lang='en'>
   <head>
      <meta charset="UTF-8"/>
      <meta name="description" content="Data Visualisation"/>
      <meta name="keywords" content="HTML, CSS, D3"/>
      <meta name="author" content="Chuong Ho" />
      <!-- Font -->
      <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Manrope&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600&display=swap" rel="stylesheet">
      <!-- CSS -->
      <link href="styles/dashboard.css" type="text/css" rel="stylesheet"/>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css" integrity="sha256-h20CPZ0QyXlBuAw7A+KluUYx/3pK+c7lYEpqLTlxjYQ=" crossorigin="anonymous" />
      <title>Visualisation of TLA+ Specifications</title>
   </head>
   <style type="text/css">
      html, body {
          height: 100%;
          margin: 0;
      }
      #home-button, #explore-button, #split-button {
          color: inherit;
          text-decoration: inherit;
      }
      .split-wrapper {
          flex: 1;
          display: flex;
          flex-direction: column;
          height: 100%;
          overflow: hidden;
      }
      .split-toolbar {
          padding: 0.5em 1em;
          flex-shrink: 0;
      }
      .split-toolbar h2 {
          margin-bottom: 0.5em;
          margin-top: 0.5em;
      }
      .split-container {
          display: flex;
          flex: 1;
          gap: 4px;
          min-height: 0;
      }
      #graphFrame {
          flex: 3;
          border: 1px solid #ccc;
          min-width: 0;
      }
      #matrixFrame {
          flex: 2;
          border: 1px solid #ccc;
          min-width: 0;
      }
      #splitUploadLabel {
          margin-right: 0.5em;
      }
      #splitClear {
          display: none;
      }
   </style>
   <body>
      <div id="navbar">
         <ul>
            <li><a href="./graphview.html" id="home-button"><i class="fas fa-sun"></i> Graph view</a></li>
            <li><a href="./matrixview.html" id="explore-button"><i class="fas fa-columns"></i> Matrix view</a></li>
            <li><a href="./splitview.html" id="split-button"><i class="fas fa-th-large"></i> Split view</a></li>
         </ul>
         <hr>
      </div>
      <div class="split-wrapper">
         <div class="split-toolbar">
            <h2 class="title">SPLIT VIEW</h2>
            <p>
               <label id="splitUploadLabel">Upload Graph JSON file</label>
               <input type="file" id="splitInput" class="form-control-file" accept=".json">
               <button type="button" class="btn btn-danger" id="splitClear">Clear</button>
            </p>
         </div>
         <div class="split-container">
            <iframe id="graphFrame" src="./graphview.html?embedded=1"></iframe>
            <iframe id="matrixFrame" src="./matrixview.html?embedded=1"></iframe>
         </div>
      </div>
      <script>
         const splitInput = document.getElementById("splitInput");
         const splitClear = document.getElementById("splitClear");

         splitInput.addEventListener("change", function() {
            const file = this.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.addEventListener("load", function(event) {
               const jsonText = event.target.result;
               document.getElementById("graphFrame").contentWindow.postMessage({ type: "loadJSON", data: jsonText }, "*");
               document.getElementById("matrixFrame").contentWindow.postMessage({ type: "loadJSON", data: jsonText }, "*");
            });
            reader.readAsText(file);
            splitClear.style.display = "inline";
         });

         splitClear.addEventListener("click", function() {
            document.getElementById("graphFrame").contentWindow.postMessage({ type: "clearDashboard" }, "*");
            document.getElementById("matrixFrame").contentWindow.postMessage({ type: "clearDashboard" }, "*");
            splitInput.value = "";
            splitClear.style.display = "none";
         });

         // Forward highlight/unhighlight messages between iframes
         var graphFrame = document.getElementById("graphFrame");
         var matrixFrame = document.getElementById("matrixFrame");
         window.addEventListener("message", function(event) {
            if (!event.data || !event.data.type) return;
            if (event.data.type === "highlight" || event.data.type === "unhighlight") {
               // Forward to the OTHER iframe (not the source)
               if (event.source === graphFrame.contentWindow) {
                  matrixFrame.contentWindow.postMessage(event.data, "*");
               } else if (event.source === matrixFrame.contentWindow) {
                  graphFrame.contentWindow.postMessage(event.data, "*");
               }
            }
         });
      </script>
   </body>
</html>
